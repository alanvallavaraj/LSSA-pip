[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lssa"
version = "0.1.0"
description = "Lost Sheep Search Algorithm (LSSA) for continuous black-box optimisation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Alan Vallavaraj" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/alanvallavaraj/LSSA-pip"
Repository = "https://github.com/alanvallavaraj/LSSA-pip"

[tool.setuptools.packages.find]
where = ["src"]
